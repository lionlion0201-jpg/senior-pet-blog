name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 毎日 09:00 JST (00:00 UTC) に自動再ビルド(2026-09-06に火木土から毎日へ変更)。
    # 予約公開(未来日付の記事)をこの時刻に反映させるためのトリガー。
    - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 記事ごとの OG 画像(タイトル+サイト名)を og-images/ に生成する。
      # 画像は SNS・画像検索向けのおまけなので、ここが失敗しても止めずに
      # 画像なしでビルド・配信を続ける(テンプレートは画像が無ければタグを出さない)。
      # フォントはリポジトリの scripts/fonts/ に同梱しているため、ここでは入れない。
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Generate OG images
        continue-on-error: true
        run: |
          python -m pip install -r scripts/requirements-og.txt
          python scripts/generate_og_images.py
      - run: npx @11ty/eleventy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
